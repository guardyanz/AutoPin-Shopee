name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm ci
        working-directory: oauth-worker
      - run: npm run check
        working-directory: oauth-worker
      - run: npm test
        working-directory: oauth-worker
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, json, mbstring
          coverage: none
      - run: composer validate --strict
        working-directory: amazon-service
      - run: composer install --prefer-dist --no-interaction --no-progress
        working-directory: amazon-service
      - run: composer check
        working-directory: amazon-service
      - run: composer test
        working-directory: amazon-service
