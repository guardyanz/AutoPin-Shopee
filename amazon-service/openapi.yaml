openapi: 3.1.0
info:
  title: AutoPin Amazon Service
  version: 1.0.0
  description: Private Amazon Creators API adapter for AutoPin Shopee.
servers:
  - url: https://amazon-service.example.com
paths:
  /health:
    get:
      operationId: getHealth
      responses:
        '200':
          description: Service is ready.
          content:
            application/json:
              schema:
                type: object
                required: [status, service, sdk]
                properties:
                  status: { type: string, const: ok }
                  service: { type: string }
                  sdk: { type: string }
  /v1/product-lookups:
    post:
      operationId: lookupProduct
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductLookupRequest'
      responses:
        '200':
          description: Amazon item metadata and Special Link.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductLookupResponse'
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '415': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    ProductLookupRequest:
      type: object
      additionalProperties: false
      required: [asin, marketplace, partner_tag]
      properties:
        asin:
          type: string
          pattern: '^[A-Z0-9]{10}$'
        marketplace:
          type: string
          example: www.amazon.com
        partner_tag:
          type: string
          minLength: 2
          maxLength: 64
    ProductLookupResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [item]
          properties:
            item:
              type: object
              required: [asin, title, detail_page_url]
              properties:
                asin: { type: string }
                title: { type: string }
                detail_page_url: { type: string, format: uri }
        meta:
          type: object
          required: [marketplace, fetched_at, cache]
          properties:
            marketplace: { type: string }
            fetched_at: { type: string, format: date-time }
            cache: { type: string, const: no-store }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
  responses:
    Error:
      description: Error response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
